name: Dependency Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency_security:
    name: Dependency security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check dependency policy before installation
        run: python security/check_dependencies.py

      - name: Install approved hash-pinned packages
        run: >
          python -m pip install
          --require-hashes
          --only-binary=:all:
          --no-cache-dir
          -r requirements.txt

      - name: Run application
        run: python app.py